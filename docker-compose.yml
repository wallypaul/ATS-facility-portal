services:
  portal:
    build:
      context: .
      args:
        # Set to the real API root on the server, e.g. https://api.example.com
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3003:80"
    restart: unless-stopped
