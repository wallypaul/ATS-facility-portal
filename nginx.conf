server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown paths (react-router deep links) get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached or users get stale bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
